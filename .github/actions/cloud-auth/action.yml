name: "Multi-Cloud Keyless OIDC Auth"
description: "Authenticates GitHub Actions to GCP (WIF) and Azure (Entra ID OIDC) without static credentials"

inputs:
  enable_gcp:
    description: "Authenticate to Google Cloud Platform"
    required: false
    default: "true"
  enable_azure:
    description: "Authenticate to Microsoft Azure"
    required: false
    default: "true"
  gcp_workload_identity_provider:
    description: "GCP Workload Identity Provider resource name"
    required: false
    default: ""
  gcp_service_account:
    description: "GCP Service Account email"
    required: false
    default: ""
  azure_client_id:
    description: "Azure Entra ID Application (Client) ID"
    required: false
    default: ""
  azure_tenant_id:
    description: "Azure Entra ID Tenant ID"
    required: false
    default: ""
  azure_subscription_id:
    description: "Azure Subscription ID"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Authenticate to Google Cloud via OIDC
      if: inputs.enable_gcp == 'true'
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
        service_account: ${{ inputs.gcp_service_account }}

    - name: Set up Google Cloud SDK
      if: inputs.enable_gcp == 'true'
      uses: google-github-actions/setup-gcloud@v2

    - name: Authenticate to Microsoft Azure via OIDC
      if: inputs.enable_azure == 'true'
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.azure_client_id }}
        tenant-id: ${{ inputs.azure_tenant_id }}
        subscription-id: ${{ inputs.azure_subscription_id }}

    - name: Export Azure OIDC Environment Variables for Terraform
      if: inputs.enable_azure == 'true'
      shell: bash
      run: |
        echo "ARM_CLIENT_ID=${{ inputs.azure_client_id }}" >> "$GITHUB_ENV"
        echo "ARM_TENANT_ID=${{ inputs.azure_tenant_id }}" >> "$GITHUB_ENV"
        echo "ARM_SUBSCRIPTION_ID=${{ inputs.azure_subscription_id }}" >> "$GITHUB_ENV"
        echo "ARM_USE_OIDC=true" >> "$GITHUB_ENV"